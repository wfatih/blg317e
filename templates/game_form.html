<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/home.css">
</head>

<body>

<h1>{{ title }}</h1>

<form method="POST">

    <label>Home Team:</label>
    <select name="home_team_id" required>
        {% for t in teams %}
            <option value="{{ t.team_id }}" {% if game.home_team_id == t.team_id %}selected{% endif %}>
                {{ t.team_name }}
            </option>
        {% endfor %}
    </select>
    <br>

    <label>Away Team:</label>
    <select name="away_team_id" required>
        {% for t in teams %}
            <option value="{{ t.team_id }}" {% if game.away_team_id == t.team_id %}selected{% endif %}>
                {{ t.team_name }}
            </option>
        {% endfor %}
    </select>
    <br>

    <label>Stadium:</label>
    <select name="stadium_id" required>
        {% for s in stadiums %}
            <option value="{{ s.stadium_id }}" {% if game.stadium_id == s.stadium_id %}selected{% endif %}>
                {{ s.stadium_name }}
            </option>
        {% endfor %}
    </select>
    <br>

    <label>Game Date:</label>
    <input type="date" name="game_date" value="{{ game.game_date }}">
    <br>

    <label>Season:</label>
    <input type="text" name="season" value="{{ game.season }}">
    <br>

    <label>Arena Name:</label>
    <input type="text" name="arena_name" value="{{ game.arena_name }}">
    <br>

    <button type="submit">Save</button>

</form>

<a href="/games">← Back to games list</a>

</body>
</html>
