<div class="form-section">
    <h3 class="section-title">
        <i class="fas fa-info-circle"></i> Game Information
    </h3>
    
    <div class="form-row">
        <div class="form-group">
            <label for="game_id">Game ID</label>
            <input type="text" 
                   id="game_id" 
                   name="game_id" 
                   class="form-control" 
                   value="{{ game.game_id if game else '' }}" 
                   {{ 'readonly' if game else 'required' }}>
        </div>

        <div class="form-group">
            <label for="season">Season</label>
            <input type="text" 
                   id="season" 
                   name="season" 
                   class="form-control" 
                   placeholder="e.g., 2023" 
                   value="{{ game.season if game else '' }}" 
                   required>
        </div>

        <div class="form-group">
            <label for="game_date">Game Date</label>
            <input type="date" 
                   id="game_date" 
                   name="game_date" 
                   class="form-control" 
                   value="{{ game.game_date if game else '' }}" 
                   required>
        </div>
    </div>
</div>
