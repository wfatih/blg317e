<div class="filter-section mb-4">
    <h5 class="mb-3">
        <i class="fas fa-filter"></i> Filter Games
    </h5>

    <form method="GET">
        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">Season</label>
                <input class="form-control"
                       type="text"
                       name="season"
                       placeholder="e.g., 2023"
                       value="{{ request.args.get('season','') }}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Team</label>
                <input class="form-control"
                       type="text"
                       name="team"
                       placeholder="Team name"
                       value="{{ request.args.get('team','') }}">
            </div>

            <div class="col-md-2">
                <label class="form-label">From Date</label>
                <input class="form-control"
                       type="date"
                       name="date_from"
                       value="{{ request.args.get('date_from','') }}">
            </div>

            <div class="col-md-2">
                <label class="form-label">To Date</label>
                <input class="form-control"
                       type="date"
                       name="date_to"
                       value="{{ request.args.get('date_to','') }}">
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button class="btn-dark w-100 me-2">
                    <i class="fas fa-search"></i> Filter
                </button>

                <a href="/games" class="btn-outline-secondary" style="width:42px; height:42px; display:flex; justify-content:center; align-items:center;">
                    <i class="fas fa-times"></i>
                </a>
            </div>

        </div>
    </form>
</div>
