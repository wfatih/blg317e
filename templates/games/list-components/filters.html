<div class="filter-section">
    <h5><i class="fas fa-filter"></i> Filter Games</h5>

    <form method="GET" action="/games">
        <div class="filter-row">

            <!-- GAME ID -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-hashtag"></i> Game ID
                </label>
                <input 
                    type="text" 
                    name="game_id" 
                    class="form-control"
                    placeholder="ID"
                    value="{{ request.args.get('game_id','') }}">
            </div>

            <!-- SEASON -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-calendar"></i> Season
                </label>
                <input 
                    type="text" 
                    name="season" 
                    class="form-control"
                    placeholder="2023"
                    value="{{ request.args.get('season','') }}">
            </div>

            <!-- TEAM -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-shield-alt"></i> Team
                </label>

                <select name="team" class="form-control">
                    <option value="">All Teams</option>
                    {% for team in teams %}
                        <option value="{{ team.team_id }}"
                            {% if request.args.get('team') == team.team_id|string %}selected{% endif %}>
                            {{ team.team_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>


            <!-- DATE FROM -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-calendar-day"></i> From
                </label>
                <input 
                    type="date" 
                    name="date_from" 
                    class="form-control"
                    value="{{ request.args.get('date_from','') }}">
            </div>

            <!-- DATE TO -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-calendar-check"></i> To
                </label>
                <input 
                    type="date" 
                    name="date_to" 
                    class="form-control"
                    value="{{ request.args.get('date_to','') }}">
            </div>

            <button type="submit" class="btn-filter">
                <i class="fas fa-search"></i>
            </button>

            <a href="/games" class="btn-clear">
                <i class="fas fa-times"></i>
            </a>

        </div>
    </form>
</div>
