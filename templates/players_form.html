{% extends "base.html" %}
{% block content %}

<h1>{{ title }}</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Player ID</label>
        <input 
            type="number" 
            name="player_id" 
            class="form-control"
            value="{{ player.player_id }}"
            {% if title != 'Add Player' %} readonly {% endif %}
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ player.full_name }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Team</label>
        <select name="team_id" class="form-select">
            <option value="">-- No Team --</option>

            {% for t in teams %}
                <option value="{{ t.team_id }}"
                    {% if player.team_id == t.team_id %} selected {% endif %}
                >
                    {{ t.team_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Position</label>
        <input type="text" name="position" class="form-control" value="{{ player.position }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Height (cm)</label>
        <input type="number" step="0.1" name="height_cm" class="form-control" value="{{ player.height_cm }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Weight (kg)</label>
        <input type="number" step="0.1" name="weight_kg" class="form-control" value="{{ player.weight_kg }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Birthdate</label>
        <input type="text" name="birthdate" class="form-control" value="{{ player.birthdate }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Country</label>
        <input type="text" name="country" class="form-control" value="{{ player.country }}">
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a href="/players" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
