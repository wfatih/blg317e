{% extends "base.html" %}
{% block content %}

<h1>{{ title }}</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Stat ID</label>
        <input 
            type="number" 
            name="stat_id" 
            class="form-control"
            value="{{ statistic.stat_id }}"
            {% if title != 'Add Statistic' %} readonly {% endif %}
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Player</label>
        <select name="player_id" class="form-select" required>
            <option value="">-- Select Player --</option>
            {% for p in players %}
                <option value="{{ p.player_id }}"
                    {% if statistic.player_id == p.player_id %} selected {% endif %}
                >
                    {{ p.full_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Game</label>
        <select name="game_id" class="form-select" required>
            <option value="">-- Select Game --</option>
            {% for g in games %}
                <option value="{{ g.game_id }}"
                    {% if statistic.game_id == g.game_id %} selected {% endif %}
                >
                    Game {{ g.game_id }} - {{ g.home_team_id }} vs {{ g.away_team_id }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Points</label>
        <input type="number" name="points" class="form-control" value="{{ statistic.points }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Assists</label>
        <input type="number" name="assists" class="form-control" value="{{ statistic.assists }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Rebounds</label>
        <input type="number" name="rebounds" class="form-control" value="{{ statistic.rebounds }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Minutes Played</label>
        <input type="number" step="0.1" name="minutes_played" class="form-control" value="{{ statistic.minutes_played }}" required>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a href="/statistics" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
