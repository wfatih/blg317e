<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Admin Panel - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d428a 0%, #c8102e 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><circle cx="500" cy="500" r="400" fill="none" stroke="white" stroke-width="2" opacity="0.03"/><circle cx="500" cy="500" r="300" fill="none" stroke="white" stroke-width="2" opacity="0.03"/><circle cx="500" cy="500" r="200" fill="none" stroke="white" stroke-width="2" opacity="0.03"/></svg>');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 45px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-section h1 {
            color: #1d428a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section .nba-text {
            color: #c8102e;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #1d428a, #c8102e, transparent);
            margin: 25px 0;
        }

        .error {
            background: #fee;
            color: #c8102e;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #c8102e;
            display: none;
        }

        .error.show {
            display: block;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #1d428a;
            background: white;
            box-shadow: 0 0 0 3px rgba(29, 66, 138, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .toggle-password:hover {
            background: #f0f0f0;
            color: #1d428a;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1d428a 0%, #0d2456 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #0d2456 0%, #1d428a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(29, 66, 138, 0.3);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-links a {
            color: #1d428a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #c8102e;
            text-decoration: underline;
        }

        .security-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .security-note svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 5px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
            }

            .logo-section .nba-text {
                font-size: 36px;
            }

            .logo-section h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="nba-text">NBA</div>
            <h1>Admin Paneli</h1>
            <p>Yönetim Platformuna Hoş Geldiniz</p>
        </div>

        <div class="divider"></div>

        <div class="error" id="errorMsg">
            {% if error %}{{ error }}{% endif %}
        </div>

        <form method="POST" id="loginForm">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <span id="toggleText">Göster</span>
                    </button>
                </div>
            </div>

            <button type="submit">Giriş Yap</button>
        </form>

        <div class="footer-links">
            <a href="#" onclick="showForgotPassword(); return false;">Şifremi Unuttum</a>
        </div>

        <div class="security-note">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            Güvenli Bağlantı
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleText = document.getElementById('toggleText');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Gizle';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Göster';
            }
        }

        function showForgotPassword() {
            alert('Şifre sıfırlama bağlantısı için sistem yöneticinizle iletişime geçin.');
        }

        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === '' || password === '') {
                e.preventDefault();
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = 'Lütfen tüm alanları doldurun.';
                errorMsg.classList.add('show');
            }
        });
    </script>
</body>
</html>
