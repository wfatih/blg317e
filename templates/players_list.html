{% extends "base.html" %}
{% block content %}
<style>
    :root {
        --primary-color: #4f46e5;
        --secondary-color: #818cf8;
        --success-color: #10b981;
        --danger-color: #ef4444;
        --warning-color: #f59e0b;
        --dark-color: #1f2937;
        --light-bg: #f9fafb;
    }

    .players-container {
        padding: 2rem 1rem;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .page-header h2 {
        font-size: 2rem;
        color: var(--dark-color);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .btn-primary-gradient {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 500;
        color: white;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all .3s ease;
        text-decoration: none;
    }

    .btn-primary-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(79,70,229,0.3);
    }

    .filter-section {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .filter-section h5 {
        font-weight: 600;
        margin-bottom: 1rem;
        color: var(--dark-color);
    }

    .filter-section .form-control {
        border-radius: 8px;
        border: 2px solid #e5e7eb;
        padding: .6rem 1rem;
        transition: .3s;
    }

    .filter-section .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 .2rem rgba(79,70,229,.15);
    }

    .table {
        width: 100%;
        table-layout: fixed;
    }


    .table-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.1);
        overflow: hidden;
    }

    .table thead th {
        background: var(--dark-color);
        color: white;
        padding: 1rem;
        border: none;
        text-transform: uppercase;
        font-size: .85rem;
    }

    .table tbody tr:hover {
        background: #f9fafb;
    }

    .table td {
        padding: 1rem;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: middle;
        text-align: center !important;
    }

    .table th, .table td {
        width: auto !important;
    }


    .btn-sm {
        padding: .4rem .8rem;
        border-radius: 6px;
        font-size: .85rem;
        display: inline-flex;
        gap: .3rem;
        align-items: center;
        text-decoration: none;
        border: none;
    }

    .btn-warning {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
    }
    .btn-danger {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
    }

</style>

<div class="players-container">

    <!-- Page Header -->
    <div class="page-header">
        <h2><i class="fas fa-users"></i> Players Management</h2>
        <a href="/players/add" class="btn-primary-gradient">
            <i class="fas fa-plus-circle"></i> Add Player
        </a>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <h5><i class="fas fa-filter"></i> Filter Players</h5>
        <form method="GET">
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Team</label>
                    <input type="text" name="team"
                           class="form-control"
                           placeholder="Team name"
                           value="{{ request.args.get('team', '') }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name"
                           class="form-control"
                           placeholder="Player name"
                           value="{{ request.args.get('name', '') }}">
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-dark w-100">
                        <i class="fas fa-search"></i> Filter
                    </button>
                </div>

            </div>
        </form>
    </div>

    <!-- Players Table -->
    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Team</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
            {% for p in players %}
                <tr>
                    <td><strong>{{ p.player_id }}</strong></td>
                    <td>{{ p.full_name }}</td>
                    <td>{{ p.team_name if p.team_name else "-" }}</td>

                    <td>
                        <a href="/players/edit/{{ p.player_id }}" class="btn-sm btn-warning">
                            <i class="fas fa-edit"></i>
                            Edit
                        </a>
                        <a href="/players/delete/{{ p.player_id }}" 
                           class="btn-sm btn-danger"
                           onclick="return confirm('Delete this player?')">
                            <i class="fas fa-trash"></i>
                            Delete
                        </a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

</div>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}
