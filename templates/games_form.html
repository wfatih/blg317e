{% extends "base.html" %}
{% block content %}

<h2>{{ title }}</h2>

<form method="POST" class="mt-3">

    <div class="mb-3">
        <label class="form-label">Game ID</label>
        <input class="form-control" type="number" name="game_id"
               value="{{ game.game_id }}"
               {% if title != 'Add Game' %} readonly {% endif %}>
    </div>

    <div class="mb-3">
        <label class="form-label">Home Team</label>
        <select class="form-control" name="home_team_id">
            {% for t in teams %}
                <option value="{{ t.team_id }}" {% if game.home_team_id == t.team_id %} selected {% endif %}>
                    {{ t.team_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Away Team</label>
        <select class="form-control" name="away_team_id">
            {% for t in teams %}
                <option value="{{ t.team_id }}" {% if game.away_team_id == t.team_id %} selected {% endif %}>
                    {{ t.team_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Stadium</label>
        <select class="form-control" name="stadium_id">
            <option value="">-- None --</option>

            {% for s in stadiums %}
                <option value="{{ s.stadium_id }}" {% if game.stadium_id == s.stadium_id %} selected {% endif %}>
                    {{ s.stadium_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Game Date</label>
        <input class="form-control" type="date" name="game_date" value="{{ game.game_date }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Season</label>
        <input class="form-control" type="text" name="season" value="{{ game.season }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Arena Name</label>
        <input class="form-control" type="text" name="arena_name" value="{{ game.arena_name }}">
    </div>

    <button class="btn btn-primary">Save</button>
    <a href="/games" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
