<div class="form-section mt-4">
    <h3 class="section-title"><i class="fas fa-dungeon"></i> Arena Details</h3>
    <div class="form-row">
        <div class="form-group">
            <label>Arena Name</label>
            <input type="text" name="arena" class="form-control" value="{{ team.arena }}">
        </div>
        <div class="form-group">
            <label>Capacity</label>
            <input type="number" name="arenacapacity" class="form-control" value="{{ team.arenacapacity }}">
        </div>
    </div>
</div>
